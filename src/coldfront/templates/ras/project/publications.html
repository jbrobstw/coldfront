{% extends 'generic/object_children.html' %}
{% load i18n %}

{% block extra_controls %}

        <a
            href="{% url 'ras:project_add_publication' pk=object.pk %}?return_url={% url 'ras:project_publications' pk=object.pk %}"
            class="btn btn-primary"
        >
            <i class="fa-solid fa-plus" aria-hidden="true"></i> {% trans "Add Publication" %}
        </a>
    {% endif %}
{% endblock extra_controls %}
